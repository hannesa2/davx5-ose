name: Development tests
on:
  push:
    branches:
      - 'main'
      - dev-ose-origin
      - ownVersion
  pull_request:

env:
  JAVA_VERSION: 21   # keep in sync with gradle/gradle-daemon-jvm.properties

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Decrypt keystore
        run: ./signing/decrypt.sh
        env:
          CRYPT_PASS: ${{ secrets.CRYPT_PASS }}

      - name: Compile
        run: ./gradlew app-ose:assembleDebug
      - name: cleanup
        run: ./signing/cleanup.sh

  unit_tests:
    needs: compile
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.gradle_encryption_key }}
          cache-read-only: true

      - name: Decrypt keystore
        run: ./signing/decrypt.sh
        env:
          CRYPT_PASS: ${{ secrets.CRYPT_PASS }}

      - name: Lint checks
        run: ./gradlew core:lintDebug app:lintOseDebug

      - name: Unit tests
        # currently no unit tests for app-ose
        run: ./gradlew core:testDebugUnitTest

  instrumented_tests:
    needs: compile
    name: Instrumented tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.gradle_encryption_key }}
          cache-read-only: true

      # gradle and Android SDK often take more space than what is available on the default runner.
      # We try to free a few GB here to make gradle-managed devices more reliable.
      - name: Free some disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false          # we need the Android SDK
          large-packages: false   # apt takes too long
          swap-storage: false     # gradle needs much memory

      - name: Restore AVD
        id: restore-avd
        uses: actions/cache/restore@v5
        with:
          path: ~/.config/.android/avd                          # where AVD is stored
          key: avd-${{ hashFiles('app-ose/build.gradle.kts') }} # gradle-managed devices are defined there

      # Enable virtualization for Android emulator
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Decrypt keystore
        run: ./signing/decrypt.sh
        env:
          CRYPT_PASS: ${{ secrets.CRYPT_PASS }}

      - name: Cache AVD
        uses: actions/cache/save@v5
        if: steps.restore-avd.outputs.cache-hit != 'true'
        with:
          path: ~/.config/.android/avd                          # where AVD is stored
          key: avd-${{ hashFiles('app-ose/build.gradle.kts') }} # gradle-managed devices are defined there

      - name: cleanup
        run: ./signing/cleanup.sh
